appId: studio.interact1017.app
productName: 互动工坊
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 互动工坊
  artifactName: Interact-Studio-${version}-setup.${ext}
portable:
  artifactName: Interact-Studio-${version}-portable.${ext}
