appId: studio.interact1017.app
productName: 互动工坊
directories:
  output: release
  buildResources: build
publish:
  provider: github
  owner: cambridgejames
  repo: InteractTools
files:
  - out/**
  - package.json
  - CHANGELOG.md
asar: true
artifactName: Interact-Studio-${version}-${arch}.${ext}
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: src/platforms/douyin/assets/LICENSE
    to: douyin-sign/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: src/renderer/src/assets/fonts/HarmonyOS_SANS_LICENSE.txt
    to: licenses/HarmonyOS-SANS.txt
win:
  icon: build/icon.png
  artifactName: Interact-Studio-${version}-win-${arch}.${ext}
  target:
    - target: nsis
    - target: portable
    - target: zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 互动工坊
  artifactName: Interact-Studio-${version}-${arch}-setup.${ext}
portable:
  artifactName: Interact-Studio-${version}-${arch}-portable.${ext}
dmg:
  artifactName: Interact-Studio-${version}-${arch}.${ext}
appImage:
  artifactName: Interact-Studio-${version}-${arch}.${ext}
deb:
  artifactName: Interact-Studio-${version}-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
  target:
    - target: dmg
    - target: zip
linux:
  icon: build/icon.png
  category: Utility
  maintainer: CambridgeJames <cambridgejames@users.noreply.github.com>
  target:
    - target: AppImage
    - target: deb
