appId: studio.interact1017.app
productName: 互动工坊
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
artifactName: Interact-Studio-${version}-${arch}.${ext}
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.png
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 互动工坊
  artifactName: Interact-Studio-${version}-${arch}-setup.${ext}
portable:
  artifactName: Interact-Studio-${version}-${arch}-portable.${ext}
dmg:
  artifactName: Interact-Studio-${version}-${arch}.${ext}
appImage:
  artifactName: Interact-Studio-${version}-${arch}.${ext}
deb:
  artifactName: Interact-Studio-${version}-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
  target:
    - target: dmg
    - target: zip
linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
    - target: deb
