version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      electron:
        patterns:
          - electron
          - electron-vite
          - electron-builder
      three:
        patterns:
          - three
          - "@types/three"
      vue:
        patterns:
          - vue
          - "@vue/*"
          - vue-tsc
      dev-tooling:
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-plugin-vue
          - typescript
          - typescript-eslint
          - vite
          - vitest
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
