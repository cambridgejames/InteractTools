name: Bug 反馈
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是最新版本，并尽量提供最小复现步骤。
        安全问题请不要走公开 Issue，见 SECURITY.md。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为与期望行为
      placeholder: 例如：投票结束后结果弹窗没有出现
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 选择...
        3. 发送...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请移除 cookie、SESSDATA、token 等敏感信息
      render: text
    validations:
      required: false
  - type: checkboxes
    id: secrets
    attributes:
      label: 确认
      options:
        - label: 我没有在 Issue 中提交任何凭据或隐私数据
          required: true
