# Tag push on the stable branch creates a multi-platform Release.
# A tag on another branch is rejected instead of silently publishing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Accept both layouts: the repository may use master or main.
  RELEASE_BRANCHES: "master main"

jobs:
  guard:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at the stable branch and match package.json
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          ok=0
          for branch in $RELEASE_BRANCHES; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" 2>/dev/null; then
              echo "tag $GITHUB_REF_NAME is on $branch"
              ok=1
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::tag $GITHUB_REF_NAME does not point at master or main"
            exit 1
          fi
          version="v$(node -p "require('./package.json').version")"
          case "$GITHUB_REF_NAME" in
            "$version"|"$version-"*) ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version, prerelease suffix allowed)"
              exit 1
              ;;
          esac

  build:
    name: Build ${{ matrix.name }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64 + arm64
            script: package:win
            artifact: windows
          - os: macos-latest
            name: macOS x64 + arm64
            script: package:mac
            artifact: macos
          - os: ubuntu-latest
            name: Linux x64 + arm64
            script: package:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and boundary/design checks
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Package ${{ matrix.script }}
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate release notes from CHANGELOG
        run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
